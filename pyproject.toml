[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surcla"
version = "1.0.0.dev0"
description = "Surrogate model recommendation for regression: predict which surrogate family will fit a dataset best, how well, and how likely the fit is to fail."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Jari Vepsäläinen", email = "jari.vepsalainen@aalto.fi" },
]
keywords = ["surrogate model", "model selection", "meta-learning", "regression", "engineering"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "pyarrow>=14",
]

[project.optional-dependencies]
lgbm = ["lightgbm>=4.0"]
xgb = ["xgboost>=2.0"]

[project.urls]
Repository = "https://github.com/vepsalai/surcla"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
surcla = ["artifacts/*"]
